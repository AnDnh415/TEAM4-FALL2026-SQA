name: SQA Pipeline

on:
  push:
  workflow_dispatch:

jobs:
  sqa:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruamel.yaml pandas numpy pyyaml typer sarif-om jschema-to-python

      - name: Run unit tests
        run: python TEST_PARSING.py

      - name: Run fuzzer
        run: python fuzz.py

      - name: Show fuzz report
        run: cat fuzz_report.txt

      - name: Run scanner on test manifests (produces forensics log)
        run: |
          yq --version
          python -c "import scanner; scanner.runScanner('TEST_ARTIFACTS')"

      - name: Show forensics log
        if: always()
        run: cat forensics.log || echo "forensics.log not created yet"

      - name: Upload fuzz report and forensics log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqa-evidence
          path: |
            fuzz_report.txt
            forensics.log
          if-no-files-found: warn
